[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-claims-intelligence"
version = "0.2.0"
description = "Synthetic healthcare claims cost intelligence, anomaly detection, and investigation prioritization platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aniketh Peruri", email = "anikethperuri7@gmail.com" }]
keywords = ["healthcare-analytics", "claims", "sql", "power-bi", "anomaly-detection", "business-intelligence"]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "tabulate>=0.9"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "black>=24.0", "ruff>=0.4", "jupyter>=1.0"]

[project.scripts]
claims-intel = "claims_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
